openapi: 3.0.3
info:
  title: Java Shannon Agent Orchestrator Core API
  version: 1.0.0
  description: Shannon 架构对齐的核心接口与事件流定义
servers:
  - url: /
security:
  - ApiKeyAuth: []
paths:
  /api/v1/tasks:
    post:
      summary: 提交任务
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskRequest'
      responses:
        '200':
          description: 提交成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    get:
      summary: 查询任务列表
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: cursor
          in: query
          schema:
            type: string
        - name: size
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/v1/tasks/{taskId}:
    get:
      summary: 查询任务状态
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/v1/stream/sse:
    get:
      summary: 订阅事件流
      parameters:
        - name: workflow_id
          in: query
          required: true
          schema:
            type: string
        - name: types
          in: query
          schema:
            type: string
        - name: last_event_id
          in: query
          schema:
            type: string
        - name: Last-Event-ID
          in: header
          schema:
            type: string
      responses:
        '200':
          description: text/event-stream
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/StreamEvent'
  /api/v1/events:
    get:
      summary: 查询事件日志
      parameters:
        - name: workflowId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/v1/timeline:
    get:
      summary: 查询时间线
      parameters:
        - name: workflowId
          in: query
          required: true
          schema:
            type: string
        - name: mode
          in: query
          schema:
            type: string
            enum: [summary, full]
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/v1/timeline/steps:
    get:
      summary: 查询步骤时间线
      parameters:
        - name: workflowId
          in: query
          required: true
          schema:
            type: string
        - name: cursor
          in: query
          schema:
            type: string
        - name: size
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/StepTimelineResponse'
        '400':
          description: 参数错误，错误码：INVALID_REQUEST、INVALID_CURSOR、TENANT_MISSING
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 访问被拒绝，错误码：POLICY_DENIED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 资源不存在，错误码：NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 服务不可用，错误码：CIRCUIT_OPEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/mcp/tools/list:
    post:
      summary: MCP 工具列表
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/McpToolListRequest'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/McpToolListResponse'
        '400':
          description: 参数错误，错误码：INVALID_REQUEST、TENANT_MISSING
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 访问被拒绝，错误码：POLICY_DENIED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 资源不存在，错误码：NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 服务不可用，错误码：MCP_UNAVAILABLE、CIRCUIT_OPEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/mcp/tools/call:
    post:
      summary: MCP 工具调用
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/McpToolCallRequest'
      responses:
        '200':
          description: 调用成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/McpToolCallResponse'
        '400':
          description: 参数错误，错误码：INVALID_REQUEST、TENANT_MISSING
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 访问被拒绝，错误码：POLICY_DENIED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 资源不存在，错误码：NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Hook 阻断，错误码：HOOK_BLOCKED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 服务不可用，错误码：MCP_UNAVAILABLE、CIRCUIT_OPEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/policy/evaluate:
    post:
      summary: 策略评估
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyRequest'
      responses:
        '200':
          description: 评估成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PolicyDecision'
        '400':
          description: 参数错误，错误码：INVALID_REQUEST、TENANT_MISSING
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 策略拒绝，错误码：POLICY_DENIED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 资源不存在，错误码：NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 服务不可用，错误码：CIRCUIT_OPEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/replay:
    post:
      summary: 任务回放
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplayRequest'
      responses:
        '200':
          description: 回放成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ReplayResponse'
        '400':
          description: 参数错误，错误码：INVALID_REQUEST、TENANT_MISSING
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 策略拒绝，错误码：POLICY_DENIED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 资源不存在，错误码：REPLAY_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 服务不可用，错误码：CIRCUIT_OPEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/memory/search:
    post:
      summary: 记忆检索
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryQuery'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/v1/memory/save:
    post:
      summary: 记忆保存
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryRecord'
      responses:
        '200':
          description: 保存成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/v1/memory/compress:
    post:
      summary: 记忆压缩
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompressionRequest'
      responses:
        '200':
          description: 压缩成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/v1/schedules:
    post:
      summary: 创建定时任务
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleSpec'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    put:
      summary: 更新定时任务
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleSpec'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    get:
      summary: 查询定时任务
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/v1/schedules/{scheduleId}/pause:
    post:
      summary: 暂停定时任务
      parameters:
        - name: scheduleId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 暂停成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/v1/schedules/{scheduleId}/resume:
    post:
      summary: 恢复定时任务
      parameters:
        - name: scheduleId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 恢复成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/v1/schedules/{scheduleId}:
    delete:
      summary: 删除定时任务
      parameters:
        - name: scheduleId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/v1/budget/usage:
    post:
      summary: 记录预算使用
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenUsageInput'
      responses:
        '200':
          description: 记录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/v1/budget/summary:
    get:
      summary: 查询预算汇总
      parameters:
        - name: taskId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    ApiResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        data:
          type: object
        traceId:
          type: string
        requestId:
          type: string
    ErrorResponse:
      description: 错误码命名以 POLICY_DENIED、SANDBOX_DENIED 为准，别名 POLICY_DENY、SANDBOX_DENY 仅用于兼容说明。
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
        traceId:
          type: string
        requestId:
          type: string
          description: 请求唯一标识（来自请求上下文/请求头生成），用于端到端排查
    TaskRequest:
      type: object
      properties:
        query:
          type: string
        sessionId:
          type: string
        context:
          type: object
        idempotencyKey:
          type: string
    TaskResponse:
      type: object
      properties:
        taskId:
          type: string
        workflowId:
          type: string
        status:
          type: string
    TaskStatusResponse:
      type: object
      properties:
        taskId:
          type: string
        workflowId:
          type: string
        status:
          type: string
        result:
          type: object
    StreamEvent:
      type: object
      properties:
        eventId:
          type: string
        schemaVersion:
          type: string
        workflowId:
          type: string
        type:
          type: string
        agentId:
          type: string
        message:
          type: string
        timestamp:
          type: string
        seq:
          type: integer
        streamId:
          type: string
        tenantId:
          type: string
        payload:
          type: object
    EventLogRecord:
      type: object
      properties:
        eventId:
          type: string
        workflowId:
          type: string
        type:
          type: string
        timestamp:
          type: string
        payload:
          type: object
    TimelineResponse:
      type: object
      properties:
        workflowId:
          type: string
        mode:
          type: string
        events:
          type: array
          items:
            $ref: '#/components/schemas/EventLogRecord'
        stats:
          type: object
    MemoryRecord:
      type: object
      properties:
        memoryId:
          type: string
        sessionId:
          type: string
        taskId:
          type: string
        content:
          type: string
        summary:
          type: string
        embeddingRef:
          type: string
    MemoryQuery:
      type: object
      properties:
        sessionId:
          type: string
        query:
          type: string
        limit:
          type: integer
    MemorySearchResult:
      type: object
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/MemoryRecord'
    CompressionRequest:
      type: object
      properties:
        sessionId:
          type: string
        strategy:
          type: string
    ScheduleSpec:
      type: object
      properties:
        scheduleId:
          type: string
        cron:
          type: string
        timezone:
          type: string
        status:
          type: string
        idempotencyKey:
          type: string
    ScheduleResponse:
      type: object
      properties:
        scheduleId:
          type: string
        status:
          type: string
    TokenUsageInput:
      type: object
      properties:
        usageId:
          type: string
        taskId:
          type: string
        agentId:
          type: string
        model:
          type: string
        provider:
          type: string
        inputTokens:
          type: integer
        outputTokens:
          type: integer
        totalTokens:
          type: integer
        costUsd:
          type: number
        tenantId:
          type: string
    TokenUsageSummary:
      type: object
      properties:
        taskId:
          type: string
        totalTokens:
          type: integer
        totalCostUsd:
          type: number
    StepRecord:
      type: object
      properties:
        stepId:
          type: string
        workflowId:
          type: string
        stepSeq:
          type: integer
        type:
          type: string
        status:
          type: string
        attempt:
          type: integer
        input:
          type: object
        output:
          type: object
        errorCode:
          type: string
        tenantId:
          type: string
        startedAt:
          type: string
        completedAt:
          type: string
    StepTimelineResponse:
      type: object
      properties:
        workflowId:
          type: string
        steps:
          type: array
          items:
            $ref: '#/components/schemas/StepRecord'
        nextCursor:
          type: string
        hasMore:
          type: boolean
    McpToolDefinition:
      type: object
      properties:
        name:
          type: string
        version:
          type: string
        description:
          type: string
        inputSchema:
          type: object
        outputSchema:
          type: object
        tags:
          type: array
          items:
            type: string
    McpToolListRequest:
      type: object
      properties:
        serverId:
          type: string
        cursor:
          type: string
        size:
          type: integer
    McpToolListResponse:
      type: object
      properties:
        tools:
          type: array
          items:
            $ref: '#/components/schemas/McpToolDefinition'
        nextCursor:
          type: string
        hasMore:
          type: boolean
    McpToolCallRequest:
      type: object
      properties:
        callId:
          type: string
        serverId:
          type: string
        toolName:
          type: string
        arguments:
          type: object
        timeoutMs:
          type: integer
    McpToolCallResponse:
      type: object
      properties:
        callId:
          type: string
        status:
          type: string
        result:
          type: object
        error:
          type: object
    PolicyRequest:
      type: object
      properties:
        policyId:
          type: string
        action:
          type: string
        resource:
          type: string
        input:
          type: object
    PolicyDecision:
      type: object
      properties:
        policyId:
          type: string
        decision:
          type: string
        reason:
          type: string
        evaluationId:
          type: string
        matchedRules:
          type: array
          items:
            type: string
    ReplayRequest:
      type: object
      properties:
        taskId:
          type: string
        fromStepId:
          type: string
        toStepId:
          type: string
        mode:
          type: string
    ReplayResponse:
      type: object
      properties:
        replayId:
          type: string
        status:
          type: string
        startedAt:
          type: string
        completedAt:
          type: string
