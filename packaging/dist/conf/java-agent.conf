# 必填：JDK 17 路径，例如 /opt/jdk 或 /path/to/jdk17
JAVA_HOME=/opt/jdk

# 可选：服务端口（映射到 --server.port），示例：SERVER_PORT=8081
# SERVER_PORT=8081

# 必填：应用配置文件路径，默认 conf/application.yml
JAVA_AGENT_CONFIG=conf/application.yml

# 可选：工具配置文件路径列表（映射到 --java-agent.toolsFiles）
# 注意：请将 tools*.yaml 中的 source 节点改为本地实际数据源配置
# JAVA_AGENT_TOOLSFILES=conf/tools-core.yaml
# JAVA_AGENT_TOOLSFILES=conf/tools-core.yaml,conf/tools-macp.yaml
JAVA_AGENT_TOOLSFILES=conf/tools-core.yaml,conf/tools-macp.yaml

# 可选：上传接口地址（映射到 --upload.url），多智能体协作平台使用
UPLOAD_URL=http://172.17.54.90:8080/api/v1/open/uploads

# 可选：JVM 启动参数
JAVA_OPTS="-Xms256m -Xmx512m --add-exports java.security.jgss/sun.security.krb5=ALL-UNNAMED --add-opens java.security.jgss/sun.security.krb5=ALL-UNNAMED"

# 可选：应用启动参数，例如：APP_OPTS="--k1.k11=v1 --k2.k22=v2"
APP_OPTS=""
