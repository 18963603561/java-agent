agent.memory.vector.enabled=false
agent.model.models.planner.endpoint=
agent.model.models.reflect.endpoint=
agent.model.models.research.endpoint=
agent.model.models.cheap.endpoint=
agent.idempotency.redis-enabled=false
agent.tool.cache.redis-enabled=false
agent.storage.mode=memory
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration

# 使用内存数据库启动 Spring 容器，避免测试依赖本地 PostgreSQL。
spring.datasource.url=jdbc:h2:mem:java_agent_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=never
