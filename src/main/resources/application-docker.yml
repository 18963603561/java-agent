spring:
  autoconfigure:
    exclude: ""
  datasource:
    url: jdbc:postgresql://localhost:5433/agent
    username: agent
    password: agent
  data:
    redis:
      host: localhost
      port: 6379

agent:
  storage:
    mode: postgres
  cot:
    max-steps: 4
    temperature-override: 0.2
    model-hint: reflect
    emit-step-events: false
    max-final-answer-chars: 400
  capability-evaluation:
    enabled: true
    risk-threshold: 0.7
    complexity-threshold: 0.7
    force-approval-above-risk: true
    budget-threshold-tokens: 10000
    default-strategy: tool
  idempotency:
    redis-enabled: true
  tool:
    cache:
      redis-enabled: true
  memory:
    vector:
      enabled: true
      provider: qdrant
      base-url: http://localhost:6333
