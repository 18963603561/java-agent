server:
  # 说明: 监听端口
  # 可选项:
  # - 1-65535
  # 默认项:
  # - 8080
  port: 8080

spring:
  application:
    # 说明: 应用程序名称
    # 可选项:
    # - 任意字符串
    # 默认项:
    # - java-agent
    name: java-agent
  autoconfigure:
    # 说明: 自动配置排除列表
    # 可选项:
    # - 以逗号分隔的类名
    # - 空字符串
    # 默认项:
    # - ""
    exclude: ""
  datasource:
    # 说明: 数据库连接地址
    # 可选项:
    # - 任意连接地址
    # 默认项:
    # - jdbc:postgresql://localhost:5433/agent
    url: jdbc:postgresql://localhost:5432/agent
    # 说明: 数据库用户名
    # 可选项:
    # - 任意字符串
    # 默认项:
    # - agent
    username: pg
    # 说明: 数据库密码
    # 可选项:
    # - 任意字符串
    # 默认项:
    # - agent
    password: pg
    # 说明: 数据库驱动类名
    # 可选项:
    # - 完整类名
    # 默认项:
    # - org.postgresql.Driver
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      # 说明: 缓存服务主机
      # 可选项:
      # - 主机名或地址
      # 默认项:
      # - localhost
      host: localhost
      # 说明: 缓存服务端口
      # 可选项:
      # - 1-65535
      # 默认项:
      # - 6379
      port: 6379

management:
  endpoints:
    web:
      exposure:
        # 说明: 暴露的端点列表
        # 可选项:
        # - 以逗号分隔的端点名称
        # 默认项:
        # - health
        # - info
        # - metrics
        include: health,info,metrics
  endpoint:
    health:
      probes:
        # 说明: 启用运行状况探测
        # 可选项:
        # - true
        # - false
        # 默认项:
        # - true
        enabled: true
  tracing:
    sampling:
      # 说明: 采样比例
      # 可选项:
      # - 0.0-1.0
      # 默认项:
      # - 1.0
      probability: 1.0

logging:
  level:
    # 说明: 根日志级别
    # 可选项:
    # - trace
    # - debug
    # - info
    # - warn
    # - error
    # 默认项:
    # - debug
    root: info
    # 说明: 应用程序日志级别
    # 可选项:
    # - trace
    # - debug
    # - info
    # - warn
    # - error
    # 默认项:
    # - debug
    com.example.agent: debug

auth:
  api-keys:
    # 说明: 接口密钥配置集合, 键为密钥别名
    # 可选项:
    # - 任意字符串键
    # 默认项:
    # - demo-key
    demo-key:
      # 说明: 绑定的用户标识
      # 可选项:
      # - 任意字符串
      # 默认项:
      # - demo-user
      user-id: demo-user
      # 说明: 角色列表
      # 可选项:
      # - ROLE_USER
      # - ROLE_ADMIN
      # 默认项:
      # - ROLE_USER
      roles:
        - ROLE_USER
  trusted-upstream:
    # 说明: 启用可信上游鉴权
    # 可选项:
    # - true
    # - false
    # 默认项:
    # - false
    enabled: false
    # 说明: 可信上游令牌
    # 可选项:
    # - 任意字符串
    # 默认项:
    # - change-me
    token: change-me
    # 说明: 可信令牌请求头名称
    # 可选项:
    # - 任意字符串
    # 默认项:
    # - X-Trusted-Token
    token-header: X-Trusted-Token

tenant:
  # 说明: 白名单路径
  # 可选项:
  # - 任意路径
  # 默认项:
  # - /actuator/health
  # - /actuator/info
  whitelist-paths:
    - /actuator/health
    - /actuator/info

agent:
  openapi:
    # 说明: 接口合约文件路径
    # 可选项:
    # - 任意路径
    # 默认项:
    # - specs/001-agent-core-spec/contracts/openapi.yaml
    contract-path: specs/001-agent-core-spec/contracts/openapi.yaml
  runtime:
    # 说明: 最大重试次数
    # 可选项:
    # - 非负整数
    # 默认项:
    # - 1
    max-retries: 1
    # 说明: 最大迭代次数
    # 可选项:
    # - 正整数
    # 默认项:
    # - 10
    maxIterations: 10
    # 说明: 最小迭代次数
    # 可选项:
    # - 正整数
    # 默认项:
    # - 1
    minIterations: 1
    # 说明: 观测窗口大小
    # 可选项:
    # - 正整数
    # 默认项:
    # - 3
    observationWindow: 3
  summary:
    # 说明: 是否启用步骤输出摘要，默认关闭便于灰度回滚
    # 可选项:
    # - true
    # - false
    # 默认值:
    # - false
    enable: false
    # 说明: 摘要整体序列化最大字符数
    # 可选项:
    # - 非负整数
    # 默认值:
    # - 4000
    max-chars: 4000
    # 说明: 列表类字段最多保留的元素数量
    # 可选项:
    # - 非负整数
    # 默认值:
    # - 20
    max-list-items: 20
    # 说明: 单个字段字符串的最大字符数
    # 可选项:
    # - 非负整数
    # 默认值:
    # - 200
    max-field-chars: 500
    raw-output:
      # 说明: 摘要禁用时是否写入受控原始输出
      # 可选项:
      # - true
      # - false
      # 默认值:
      # - false
      enable: true
      # 说明: 原始输出最大字符数
      # 可选项:
      # - 非负整数
      # 默认值:
      # - 2000
      max-chars: 5000
      # 说明: 列表或映射允许采样的最大条目数
      # 可选项:
      # - 非负整数
      # 默认值:
      # - 20
      max-list-items: 20
      # 说明: 单字段最大字符数
      # 可选项:
      # - 非负整数
      # 默认值:
      # - 200
      max-field-chars: 1000
      # 说明: 允许输出的字段白名单（大小写不敏感）
      allow-keys:
        - answer
        - result
        - data
        - error
        - message
        - code
        - status
        - tool
        - toolName
        - highlights
      # 说明: 需要脱敏的字段列表（大小写不敏感）
      mask-keys:
        - password
        - token
        - secret
        - authorization
        - apiKey
        - accessKey
        - refreshToken
        - credential
  final-output:
    # 说明: 最终输出提示词摘要最大字符数
    # 可选项:
    # - 非负整数
    # 默认值:
    # - 800
    prompt-summary-max-chars: 800
  cot:
    # 说明: 最大推理步数
    # 可选项:
    # - 正整数
    # 默认项:
    # - 4
    max-steps: 4
    # 说明: 历史步骤摘要最多保留条数
    # 可选项:
    # - 正整数
    # 默认项:
    # - 10
    max-step-summaries: 10
    # 说明: 温度覆盖值
    # 可选项:
    # - 0.0-2.0
    # 默认项:
    # - 0.2
    temperature-override: 0.2
    # 说明: 推理模型提示标识
    # 可选项:
    # - 已配置模型标识
    # 默认项:
    # - reflect
    model-hint: reflect
    # 说明: 是否发出推理步骤事件
    # 可选项:
    # - true
    # - false
    # 默认项:
    # - false
    emit-step-events: false
    # 说明: 最终答案最大字符数
    # 可选项:
    # - 正整数
    # 默认项:
    # - 400
    max-final-answer-chars: 400
  planner:
    llm-enabled: true
  capability-evaluation:
    # 说明: 启用能力评估
    # 可选项:
    # - true
    # - false
    # 默认项:
    # - true
    enabled: true
    # 说明: 风险阈值
    # 可选项:
    # - 0.0-1.0
    # 默认项:
    # - 0.7
    risk-threshold: 0.7
    # 说明: 复杂度阈值
    # 可选项:
    # - 0.0-1.0
    # 默认项:
    # - 0.7
    complexity-threshold: 0.7
    # 说明: 高于风险阈值时强制审批
    # 可选项:
    # - true
    # - false
    # 默认项:
    # - true
    force-approval-above-risk: true
    # 说明: 预算阈值令牌数
    # 可选项:
    # - 非负整数
    # 默认项:
    # - 10000
    budget-threshold-tokens: 10000
    # 说明: 默认策略
    # 可选项:
    # - tool
    # - memory
    # - manual
    # 默认项:
    # - tool
    default-strategy: tool
  storage:
    # 说明: 存储方式
    # 可选项:
    # - 实现支持的取值
    # 默认项:
    # - postgres
    mode: postgres
  sse:
    # 说明: 流式响应超时秒数
    # 可选项:
    # - 正整数
    # 默认项:
    # - 30
    timeoutSeconds: 120
    # 说明: 最大流消息大小
    # 可选项:
    # - 正整数
    # 默认项:
    # - 1024
    max-stream-size: 1024
  idempotency:
    # 说明: 启用幂等性缓存
    # 可选项:
    # - true
    # - false
    # 默认项:
    # - true
    redis-enabled: true
    # 说明: 幂等缓存存活时间秒数
    # 可选项:
    # - 正整数
    # 默认项:
    # - 86400
    ttl-seconds: 86400
  mcp:
    # 说明: 启用远端调用
    # 可选项:
    # - true
    # - false
    # 默认项:
    # - false
    remote-enabled: true
    # 说明: 远端失败后回退到本地
    # 可选项:
    # - true
    # - false
    # 默认项:
    # - false
    fallback-to-local: true
    # 说明: 合并远端与本地工具清单
    # 可选项:
    # - true
    # - false
    # 默认项:
    # - false
    merge-local-tools: true
    # 说明: 工具调用策略
    # 可选项:
    # - remote-only
    # - local-only
    # - remote-first
    # - local-first
    # 默认项:
    # - remote-first
    call-strategy: remote-first
    tool-refresh:
      # 说明: 是否启用远程工具缓存刷新
      # 可选项:
      # - true
      # - false
      # 默认值:
      # - true
      enabled: true
      # 说明: 远程工具缓存刷新间隔秒数
      # 可选项:
      # - 非负整数
      # 默认值:
      # - 300
      ttl-seconds: 300
      # 说明: 单次同步最大工具数量
      # 可选项:
      # - 非负整数
      # 默认值:
      # - 2000
      max-tools: 2000
    default-server-id: mcp-test
    # 说明: 外部工具服务列表
    # 可选项:
    # - 列表
    # 默认项:
    # - 包含一个示例项
    servers:
      -
        # 说明: 服务标识
        # 可选项:
        # - 任意字符串
        # 默认项:
        # - mcp-default
        id: mcp-default
        # 说明: 是否可用
        # 可选项:
        # - true
        # - false
        # 默认项:
        # - true
        available: true
        allowed-hosts:
          - localhost
          - 127.0.0.1
        # 说明: SSE 会话地址
        # 可选项:
        # - 任意地址
        # 默认项:
        # - ""
        sse-url: http://localhost:8088/mcp/sse
        # 说明: SSE 会话参数名称
        # 可选项:
        # - 任意字符串
        # 默认项:
        # - sessionId
        session-param-name: sessionId
        # 说明: SSE 会话刷新间隔秒数，0 表示不主动刷新
        # 可选项:
        # - 非负整数
        # 默认项:
        # - 300
        session-refresh-seconds: 300
        # 说明: 远程调用协议
        # 可选项:
        # - rest
        # - jsonrpc
        # 默认项:
        # - rest
        protocol: jsonrpc
        # 说明: 服务基础地址
        # 说明: SSE 场景会自动拼接 sessionId
        # 可选项:
        # - 任意地址
        # 默认项:
        # - http://localhost:9999
        base-url: http://localhost:8088/mcp
      -
        id: mcp-test
        available: true
        allowed-hosts:
          - localhost
          - 127.0.0.1
        sse-url: http://localhost:8088/mcp/sse
        session-param-name: sessionId
        session-refresh-seconds: 300
        protocol: jsonrpc
        base-url: http://localhost:8088/mcp/test
  hook:
    # 说明: 启用钩子
    # 可选项:
    # - true
    # - false
    # 默认项:
    # - true
    enabled: true
    # 说明: 被拦截工具列表
    # 可选项:
    # - 工具名称
    # 默认项:
    # - []
    blocked-tools: []
  sandbox:
    wasi:
      # 说明: 启用沙盒
      # 可选项:
      # - true
      # - false
      # 默认项:
      # - true
      enabled: true
      # 说明: 沙盒阻止工具列表
      # 可选项:
      # - 工具名称
      # 默认项:
      # - []
      blocked-tools: []
  model:
    http:
      # 说明: 全局接口密钥, 模型级配置优先
      # 可选项:
      # - 任意字符串
      # - 空字符串表示不需要鉴权
      # 默认项:
      # - ""
      api-key: "sk-1101c8c7a1954494b1cac9b01b9d2447"
    models:
      planner:
        # 说明: 模型标识
        # 可选项:
        # - 任意字符串
        # 默认项:
        # - planner
        model-id: deepseek-chat
        # 说明: 提供商
        # 可选项:
        # - 实现支持的取值
        # 默认项:
        # - local
        provider: openai
        supports-developer-role: false
        # 说明: 调用端点
        # 可选项:
        # - 任意字符串
        # 默认项:
        # - local
        endpoint: https://api.deepseek.com/v1
        # 说明: 模型级接口密钥
        # 可选项:
        # - 任意字符串
        # - 空字符串表示不需要鉴权
        # 默认项:
        # - ""
        api-key: ""
        # 说明: 输入成本
        # 可选项:
        # - 非负数
        # 默认项:
        # - 0
        input-cost-usd: 0
        # 说明: 输出成本
        # 可选项:
        # - 非负数
        # 默认项:
        # - 0
        output-cost-usd: 0
        # 说明: 最大令牌数
        # 可选项:
        # - 正整数
        # 默认项:
        # - 4096
        max-tokens: 4096
      reflect:
        # 说明: 模型标识
        # 可选项:
        # - 任意字符串
        # 默认项:
        # - reflect
        model-id: deepseek-chat
        # 说明: 提供商
        # 可选项:
        # - 实现支持的取值
        # 默认项:
        # - local
        provider: openai
        supports-developer-role: false
        # 说明: 调用端点
        # 可选项:
        # - 任意字符串
        # 默认项:
        # - local
        endpoint: https://api.deepseek.com/v1
        # 说明: 模型级接口密钥
        # 可选项:
        # - 任意字符串
        # - 空字符串表示不需要鉴权
        # 默认项:
        # - ""
        api-key: ""
        # 说明: 输入成本
        # 可选项:
        # - 非负数
        # 默认项:
        # - 0
        input-cost-usd: 0
        # 说明: 输出成本
        # 可选项:
        # - 非负数
        # 默认项:
        # - 0
        output-cost-usd: 0
        # 说明: 最大令牌数
        # 可选项:
        # - 正整数
        # 默认项:
        # - 4096
        max-tokens: 4096
      research:
        # 说明: 模型标识
        # 可选项:
        # - 任意字符串
        # 默认项:
        # - research
        model-id: deepseek-chat
        # 说明: 提供商
        # 可选项:
        # - 实现支持的取值
        # 默认项:
        # - local
        provider: openai
        supports-developer-role: false
        # 说明: 调用端点
        # 可选项:
        # - 任意字符串
        # 默认项:
        # - local
        endpoint: https://api.deepseek.com/v1
        # 说明: 模型级接口密钥
        # 可选项:
        # - 任意字符串
        # - 空字符串表示不需要鉴权
        # 默认项:
        # - ""
        api-key: ""
        # 说明: 输入成本
        # 可选项:
        # - 非负数
        # 默认项:
        # - 0
        input-cost-usd: 0
        # 说明: 输出成本
        # 可选项:
        # - 非负数
        # 默认项:
        # - 0
        output-cost-usd: 0
        # 说明: 最大令牌数
        # 可选项:
        # - 正整数
        # 默认项:
        # - 4096
        max-tokens: 4096
      cheap:
        # 说明: 模型标识
        # 可选项:
        # - 任意字符串
        # 默认项:
        # - cheap
        model-id: deepseek-chat
        # 说明: 提供商
        # 可选项:
        # - 实现支持的取值
        # 默认项:
        # - local
        provider: openai
        supports-developer-role: false
        # 说明: 调用端点
        # 可选项:
        # - 任意字符串
        # 默认项:
        # - local
        endpoint: https://api.deepseek.com/v1
        # 说明: 模型级接口密钥
        # 可选项:
        # - 任意字符串
        # - 空字符串表示不需要鉴权
        # 默认项:
        # - ""
        api-key: ""
        # 说明: 输入成本
        # 可选项:
        # - 非负数
        # 默认项:
        # - 0
        input-cost-usd: 0
        # 说明: 输出成本
        # 可选项:
        # - 非负数
        # 默认项:
        # - 0
        output-cost-usd: 0
        # 说明: 最大令牌数
        # 可选项:
        # - 正整数
        # 默认项:
        # - 2048
        max-tokens: 2048
    routes:
      # 说明: 规划模型路由
      # 可选项:
      # - 已配置模型标识
      # 默认项:
      # - planner
      planner: planner
      # 说明: 反思模型路由
      # 可选项:
      # - 已配置模型标识
      # 默认项:
      # - reflect
      reflect: reflect
      # 说明: 研究模型路由
      # 可选项:
      # - 已配置模型标识
      # 默认项:
      # - research
      research: research
      # 说明: 低成本模型路由
      # 可选项:
      # - 已配置模型标识
      # 默认项:
      # - cheap
      cheap: cheap
    # 说明: 启用回退
    # 可选项:
    # - true
    # - false
    # 默认项:
    # - true
