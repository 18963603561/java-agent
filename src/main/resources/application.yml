server:
  port: 8080

spring:
  application:
    name: java-agent

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    root: debug
    com.example.agent: debug

auth:
  api-keys:
    demo-key:
      user-id: demo-user
      roles:
        - ROLE_USER
  trusted-upstream:
    enabled: false
    token: change-me
    token-header: X-Trusted-Token

tenant:
  whitelist-paths:
    - /actuator/health
    - /actuator/info

agent:
  openapi:
    contract-path: specs/001-agent-core-spec/contracts/openapi.yaml
  runtime:
    max-retries: 1
  storage:
    mode: memory
  sse:
    timeoutSeconds: 30
  idempotency:
    redis-enabled: false
    ttl-seconds: 86400
  mcp:
    servers:
      - id: mcp-default
        available: true
        base-url: http://localhost:9999
  hook:
    enabled: true
    blocked-tools: []
  sandbox:
    wasi:
      enabled: true
      blocked-tools: []
  model:
    models:
      planner:
        model-id: planner
        provider: local
        endpoint: local
        input-cost-usd: 0
        output-cost-usd: 0
        max-tokens: 4096
      reflect:
        model-id: reflect
        provider: local
        endpoint: local
        input-cost-usd: 0
        output-cost-usd: 0
        max-tokens: 4096
      research:
        model-id: research
        provider: local
        endpoint: local
        input-cost-usd: 0
        output-cost-usd: 0
        max-tokens: 4096
      cheap:
        model-id: cheap
        provider: local
        endpoint: local
        input-cost-usd: 0
        output-cost-usd: 0
        max-tokens: 2048
    routes:
      planner: planner
      reflect: reflect
      research: research
      cheap: cheap
    fallback-enabled: true
    fallback-model-id: cheap
  profiles:
    items:
      - agent-id: planner
        model-id: planner
        prompt: planner
        allow-tools:
          - demo_tool
        budget-tokens: 2000
      - agent-id: reflector
        model-id: reflect
        prompt: reflect
        allow-tools:
          - demo_tool
        budget-tokens: 2000
  deep-research:
    steps:
      - name: gather
        model-id: research
      - name: synthesize
        model-id: reflect
  memory:
    vector:
      enabled: false
      provider: qdrant
      base-url: http://localhost:6333
      collection: memory_records
      dimension: 256
      timeout-seconds: 5
  budget:
    enabled: true
    threshold-tokens: 10000
  rate-limit:
    max-per-minute: 100
  circuit:
    failure-threshold: 3
    open-seconds: 30
  tool:
    cache:
      redis-enabled: false
