server:
  port: 8080

spring:
  application:
    name: java-agent

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    root: INFO
    com.example.agent: INFO

auth:
  api-keys:
    demo-key:
      user-id: demo-user
      roles:
        - ROLE_USER
  trusted-upstream:
    enabled: false
    token: change-me
    token-header: X-Trusted-Token

tenant:
  whitelist-paths:
    - /actuator/health
    - /actuator/info
