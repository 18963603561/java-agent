server:
  port: 8080

spring:
  application:
    name: java-agent
  autoconfigure:
    exclude: ""
  datasource:
    url: jdbc:postgresql://localhost:5433/agent
    username: agent
    password: agent
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    root: debug
    com.example.agent: debug

auth:
  api-keys:
    demo-key:
      user-id: demo-user
      roles:
        - ROLE_USER
  trusted-upstream:
    enabled: false
    token: change-me
    token-header: X-Trusted-Token

tenant:
  whitelist-paths:
    - /actuator/health
    - /actuator/info

agent:
  openapi:
    contract-path: specs/001-agent-core-spec/contracts/openapi.yaml
  runtime:
    max-retries: 1
    maxIterations: 10
    minIterations: 1
    observationWindow: 3
  cot:
    max-steps: 4
    temperature-override: 0.2
    model-hint: reflect
    emit-step-events: false
    max-final-answer-chars: 400
  capability-evaluation:
    enabled: true
    risk-threshold: 0.7
    complexity-threshold: 0.7
    force-approval-above-risk: true
    budget-threshold-tokens: 10000
    default-strategy: tool
  storage:
    mode: postgres
  sse:
    timeoutSeconds: 30
    max-stream-size: 1024
  idempotency:
    redis-enabled: true
    ttl-seconds: 86400
  mcp:
    servers:
      - id: mcp-default
        available: true
        base-url: http://localhost:9999
  hook:
    enabled: true
    blocked-tools: []
  sandbox:
    wasi:
      enabled: true
      blocked-tools: []
  model:
    models:
      planner:
        model-id: planner
        provider: local
        endpoint: local
        input-cost-usd: 0
        output-cost-usd: 0
        max-tokens: 4096
      reflect:
        model-id: reflect
        provider: local
        endpoint: local
        input-cost-usd: 0
        output-cost-usd: 0
        max-tokens: 4096
      research:
        model-id: research
        provider: local
        endpoint: local
        input-cost-usd: 0
        output-cost-usd: 0
        max-tokens: 4096
      cheap:
        model-id: cheap
        provider: local
        endpoint: local
        input-cost-usd: 0
        output-cost-usd: 0
        max-tokens: 2048
    routes:
      planner: planner
      reflect: reflect
      research: research
      cheap: cheap
    fallback-enabled: true
    fallback-model-id: cheap
  profiles:
    items:
      - agent-id: planner
        model-id: planner
        prompt: planner
        allow-tools:
          - demo_tool
        budget-tokens: 2000
      - agent-id: reflector
        model-id: reflect
        prompt: reflect
        allow-tools:
          - demo_tool
        budget-tokens: 2000
  deep-research:
    steps:
      - name: gather
        model-id: research
      - name: synthesize
        model-id: reflect
  memory:
    vector:
      enabled: true
      provider: qdrant
      base-url: http://localhost:6333
      collection: memory_records
      dimension: 256
      timeout-seconds: 5
    recall:
      enabled: true
      limit: 10
      min-query-length: 4
      include-compressed: true
      max-summary-chars: 800
      max-record-chars: 500
    write:
      enabled: true
      save-user-query: true
      save-final-output: true
      max-record-chars: 2000
      max-summary-chars: 500
  budget:
    enabled: true
    threshold-tokens: 10000
  rate-limit:
    max-per-minute: 100
  circuit:
    failure-threshold: 3
    open-seconds: 30
  tool:
    cache:
      redis-enabled: true
